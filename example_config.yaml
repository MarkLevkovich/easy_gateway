# Easy-Gateway configuration example
# All fields are optional except routes[].path and routes[].target

server:
  host: "0.0.0.0"    # interface to bind
  port: 8000         # port to listen on

redis:
  enabled: true            # false -> cache disabled (no Redis needed)
  url: "redis://localhost:6379"
  expire_time: 300         # cache TTL in seconds (default: 180)

routes:
  # PREFIX route: /bin/anything -> https://httpbin.org/anything, /bin/ip -> https://httpbin.org/ip, ...
  - path: "/bin/*"                 # any path starting with /bin
    target: "https://httpbin.org/" # full URL, the requested path is appended
    description: "HTTPBin playground"
    cache: true                    # enable response caching (default: false)

  # EXACT route: only /users -> https://api.example.com/users
  # IMPORTANT: for exact routes the target must NOT include the path —
  # the route path is appended to the target automatically
  - path: "/users"                 # exact match only
    target: "https://api.example.com"
    description: "Exact route demo"
    cache: true

  - path: "/pets/*"
    target: "https://petstore.swagger.io/"
    description: "Pets service"
    cache: true

  # EXACT route demo against a real API: /jokes/random -> https://api.chucknorris.io/jokes/random
  - path: "/jokes/random"
    target: "https://api.chucknorris.io"
    description: "Random joke endpoint"
    cache: true

middlewares:
  - name: "LoggingMiddleware"
    enabled: true

  - name: "RateLimitMiddleware"
    enabled: true
    requests_per_minute: 30

cors:
  allow_origins:
    - "https://myfront.com"
    - "https://testreact.space"

admin:
  username: "admin"   # default: admin
  password: "admin"   # change me in production!
